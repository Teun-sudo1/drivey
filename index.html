<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Drivey</title>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="glass" aria-hidden="true"></canvas>
<div id="vignette"></div>
<div id="grain"></div>

<div id="hud">
  <div id="top">
    <div id="chip"><span class="dot"></span><span id="phaseName">Focus</span><span id="cycle">1/4</span></div>
    <div class="spacer"></div>
    <button class="icon" id="btnFull" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="timerWrap"><div id="time" role="timer">25:00</div><div id="sub"></div></div>
  <div id="controls">
    <button class="icon" id="btnReset" aria-label="Reset"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4"/></svg></button>
    <button class="play" id="btnPlay" aria-label="Start"><svg viewBox="0 0 24 24" id="playIco"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="icon" id="btnSkip" aria-label="Skip phase"><svg viewBox="0 0 24 24"><path d="M6 5l9 7-9 7zM18 5v14"/></svg></button>
    <button class="icon" id="btnPanel" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
</div>

<div id="panel" class="hidden" aria-label="Settings" inert>
  <div class="tabs">
    <button data-tab="timer" class="on">Timer</button><button data-tab="scene">Scene</button>
    <button class="x" id="btnClose" aria-label="Close settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="body">
    <section id="tab-timer" class="on">
      <h4>Durations (minutes)</h4>
      <div class="num" data-n="focus">Focus</div>
      <div class="num" data-n="short">Short break</div>
      <div class="num" data-n="long">Long break</div>
      <div class="num" data-n="every">Long break every</div>
      <h4>Behaviour</h4>
      <div class="tog" data-k="auto">Auto-start next phase</div>
      <div class="tog" data-k="breakSlow">Slow down during breaks</div>
      <p class="note">Keys: Space start/pause · F fullscreen · H hide UI</p>
    </section>
    <section id="tab-scene">
      <h4>Drive on the</h4>
      <div class="seg" id="segSide" aria-label="Drive on the"></div>
      <h4>Time of day</h4>
      <div class="seg" id="segTod" aria-label="Time of day"></div>
      <h4>Weather</h4>
      <div class="seg" id="segWeather" aria-label="Weather"></div>
      <h4>Graphics</h4>
      <div class="tog" data-k="bloom">Bloom</div>
      <div class="tog" data-k="vignette">Vignette</div>
      <div class="tog" data-k="grain">Film grain</div>
      <div class="tog" data-k="reduced">Reduced motion</div>
    </section>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
